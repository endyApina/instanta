<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153f36" />
    <meta name="description" content="Set saving goals, organize your NGN wallet and practice investing ideas with Instanta's paper simulator. Thoughtful tools for your money journey." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Instanta | Make progress feel like yours" />
    <meta property="og:description" content="Set goals, build a saving rhythm and explore investing ideas at your own pace with Instanta." />
    <meta property="og:site_name" content="Instanta" />
    <meta name="twitter:card" content="summary" />
    <title>Instanta | Make progress feel like yours</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Instanta",
        "description": "Tools for saving goals, a Nigerian naira wallet experience and simulated investing practice.",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
    listen 80;
    server_name _;

    root /app/instanta/dist/web;
    index index.html;

    location = /app {
        return 301 /app/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
